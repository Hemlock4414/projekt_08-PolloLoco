<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <link rel="stylesheet" href="./style.css">
    <link rel="shortcut icon" href="img/8_coin/coin_3.png" type="image/png">
    <title>El Pollo Loco</title>
</head>
<body onload="init()">

    <h1>El Pollo Loco</h1>

    <div id="fullscreen">

        <canvas id="myCanvas" width="720" height="480"></canvas>

        <div id="startScreen">
            <button id="startBtn" class="primary-btn" onclick="startGame()">Start Game</button>
        </div>

        <div id="hudControls-bottomRight" class="hud-corner bottom-right">
            <button id="muteBtn" onclick="toggleMute()">
                <img  id="muteIcon" src="img/icons/icons8-mute-50.png" alt="Mute">
            </button>
            <button id="fullscreenBtn" onclick="toggleFullscreen()">
                <img  id="fullscreenIcon" src="img/icons/icons8-full-screen-48.png" alt="Fullscreen">
            </button>
        </div>

        <div id="hudControls-topLeft" class="hud-corner top-left">
            <button id="restartBtn" class="primary-btn restart-btn" onclick="restart()">Restart</button>
        </div>

        <button id="controlsInfoBtn" class="controls-info-btn" onclick="openControlsDialog()">🎮 Controls</button>
    </div>

    <div id="controlsInfo" class="controls-info">
        <div class="control-item">
            <img src="img/icons/icons8-left-48.png" alt="Arrow Left">
            <span>Move Left</span>
        </div>
        <div class="control-item">
            <img src="img/icons/icons8-right-48.png" alt="Arrow Right">
            <span>Move Right</span>
        </div>
        <div class="control-item">
            <img src="img/icons/icons8-arrow-up-48.png" alt="Arrow Up">
            <span>Jump</span>
        </div>
        <div class="control-item">
            <img src="img/icons/icons8-spacebar-black-50.png" alt="Space">
            <span>Throw</span>
        </div>
    </div>

    <dialog id="controlsDialog" class="controls-dialog">
        <button class="controls-dialog-close" onclick="closeControlsDialog()">✕</button>
        <h2>Controls</h2>
        <div class="controls-grid">
            <div class="control-item">
                <img src="img/icons/icons8-left-48.png" alt="Arrow Left">
                <span>Move Left</span>
            </div>
            <div class="control-item">
                <img src="img/icons/icons8-right-48.png" alt="Arrow Right">
                <span>Move Right</span>
            </div>
            <div class="control-item">
                <img src="img/icons/icons8-arrow-up-48.png" alt="Arrow Up">
                <span>Jump</span>
            </div>
            <div class="control-item">
                <img src="img/icons/icons8-spacebar-white-50.png" alt="Space">
                <span>Throw</span>
            </div>
        </div>
    </dialog>

    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/collidable-object.class.js"></script>
    <script src="./models/background-object.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/chicken-small.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/status-bar.class.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/bottle.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./levels/level1.js"></script>
    <script src="./js/game.js"></script>
</body>
</html>
